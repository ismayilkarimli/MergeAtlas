name: Release

# Pushing a tag such as v0.2.0 publishes a GitHub release with that version's part of CHANGELOG.md, once CI passes
# and the tag names the version the script and the plugin carry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag names the version in the code
        run: |
          version="$(python3 skills/mergeatlas/scripts/mergeatlas.py version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the code is version $version. Tag v$version, or bump the version first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Take this version's notes from the changelog
        run: |
          awk -v heading="## $VERSION" 'index($0, heading) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has nothing under '## $VERSION'."
            exit 1
          fi
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --title "MergeAtlas $VERSION" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
