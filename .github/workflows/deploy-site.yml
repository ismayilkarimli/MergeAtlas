name: Deploy site

# Every push to main publishes site/ to Cloudflare Pages once CI passes, unless the push changes only the README.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The site's sample map runs on the skill's own viewer, so a broken viewer never reaches it.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Runs from site/ so Pages finds functions/ and resolves map/index.html's link to the skill's viewer.
      # npx keeps Wrangler in npm's cache, so no package files land in the uploaded folder.
      - working-directory: site
        run: npx --yes wrangler@4.151.3 pages deploy . --project-name=mergeatlas --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
