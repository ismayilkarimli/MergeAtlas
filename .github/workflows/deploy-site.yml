name: Deploy site

# Every push to main publishes site/ to Cloudflare Pages, unless the push changes only the README.
on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Runs from site/ so Pages finds functions/ and resolves map/index.html's link to the skill's viewer.
      # npx keeps Wrangler in npm's cache, so no package files land in the uploaded folder.
      - working-directory: site
        run: npx --yes wrangler@4.151.3 pages deploy . --project-name=mergeatlas --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
