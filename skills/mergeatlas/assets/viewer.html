<script>
const KIND = {
  core:    { color: 'var(--core)',    label: 'New behaviour' },
  cleanup: { color: 'var(--cleanup)', label: 'Cleanup' },
  test:    { color: 'var(--test)',    label: 'Test' },
  docs:    { color: 'var(--docs)',    label: 'Docs' },
  config:  { color: 'var(--config)',  label: 'Config' },
};
const EDGE_KIND = {
  enables:  { color: 'var(--core)',    label: 'Enables' },
  replaces: { color: 'var(--cleanup)', label: 'Makes redundant' },
  verifies: { color: 'var(--test)',    label: 'Verified by' },
  docs:     { color: 'var(--docs)',    label: 'Documented in' },
  depends:  { color: 'var(--config)',  label: 'Depends on' },
  reach:    { color: 'var(--muted)',   label: 'Also reaches' },
};

let CARDS = [], EDGES = [], META = {};

/* ---------- state ---------- */
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const codeUrl = at => {
  const [path, lines = ''] = at.split('#'), diff = META.diffs[path];
  return diff ? `${META.url}/files#diff-${diff}${lines.replace(/L/g, 'R')}` : META.blob + at;
};
const keyLine = ({ gap, text, path, line, key }) => {
  if (gap) return '<span class="keygap">⋯</span>';
  const mark = { '+': ' a', '-': ' d' }[text[0]] ?? '';
  return `<a class="keyline${mark}${key ? '' : ' around'}" href="${esc(`${META.url}/files#diff-${META.diffs[path]}${line}`)}" target="_blank" rel="noopener"><span class="lineno">${line.slice(1)}</span>${esc(text)}</a>`;
};
const codeLink = (at, text) => `<a class="codelink" href="${esc(codeUrl(at))}" target="_blank" rel="noopener">${text}</a>`;
const fmt = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\(([^)#\s]+#L\d+(?:-L\d+)?)\)/g, (_, text, at) => codeLink(at, text));
const story = t => fmt(t).replace(/\[([^\]]+)\]\(([\w-]+)\)/g, '<a class="cardlink" href="#" data-card="$2">$1</a>');
document.addEventListener('click', ev => { if (ev.target.closest('.cardlink')) ev.preventDefault(); });
const codeHtml = t => esc(t).split('\n').map(l => l.startsWith('+') ? `<span class="a">${l}</span>` : l.startsWith('-') ? `<span class="d">${l}</span>` : l).join('\n');

const $ = (s, r = document) => r.querySelector(s);
const viewport = $('#viewport'), world = $('#world'), svg = $('#edges');
const view = { x: 0, y: 0, k: 1 };
const cardEl = {}; let byId = {};
const NS = 'http://www.w3.org/2000/svg';
const pillEl = {}, grpEl = {};
const reachNodes = [];
const allNodes = () => [...CARDS, ...reachNodes];
const allLinks = () => [...EDGES, ...reachNodes.map(n => ({ id: `to:${n.id}`, from: n.source, to: n.id, kind: 'reach' }))];
const STACK_MS = 340, STACK_COLUMNS = 3, FILE_GAP = 14, STACK_PADDING = 18, FILE_STAGGER = .07;
const smooth = t => t * t * (3 - 2 * t);

/* ---------- build ---------- */
function build() {
  // markers
  const defs = document.createElementNS(NS, 'defs');
  for (const [k, v] of Object.entries(EDGE_KIND)) {
    const m = document.createElementNS(NS, 'marker');
    m.setAttribute('id', 'arrow-' + k); m.setAttribute('viewBox', '0 0 10 10'); m.setAttribute('refX', '9'); m.setAttribute('refY', '5');
    m.setAttribute('markerWidth', '8'); m.setAttribute('markerHeight', '8'); m.setAttribute('orient', 'auto-start-reverse');
    m.setAttribute('markerUnits', 'userSpaceOnUse'); m.setAttribute('markerWidth', '14'); m.setAttribute('markerHeight', '14');
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M0,0 L10,5 L0,10 z'); p.setAttribute('fill', v.color);
    m.appendChild(p); defs.appendChild(m);
  }

  const skipped = unaffected.reduce((sum, u) => sum + u.paths.length, 0);
  return `
    <h4>Also reaches</h4>
    <p class="reach-count">Affected: ${affected} of ${c.checked} ${c.checked === 1 ? 'file' : 'files'} outside this PR</p>
    ${reaches.map(r => item(r.paths, r.effect)).join('')}
    ${skipped ? `<details class="reach"><summary>${skipped} unaffected</summary>${unaffected.map(u => item(u.paths, u.reason)).join('')}</details>` : ''}
    <p class="reach-note">Found by name, one step out from the changed code. Dependency injection, reflection and configuration are not searched.</p>`;
}
function cardHtml(c) {
  const out = EDGES.filter(e => e.from === c.id), inn = EDGES.filter(e => e.to === c.id);
  const link = (e, dirLabel, other) => `<button data-edge="${e.id}">${dirLabel} ${esc(byId[other].title)} · ${esc(e.label)}</button>`;
  const grid = reachNodes.find(n => n.source === c.id);
  const gridLink = grid ? `<button data-grid="${grid.id}">→ ${grid.files.length > 1 ? `${grid.files.length} affected files` : esc(fileName(grid.files[0]))} · outside this PR</button>` : '';
  return `
    <div class="tag" style="color:${KIND[c.kind].color}">${KIND[c.kind].label} · <span class="stat"><span class="a">+${c.add}</span><span class="d">−${c.del}</span></span></div>
    <h2>${esc(c.title)}</h2>
    <div class="path">${c.paths.map(p => codeLink(p, esc(p))).join('<br>')}</div>
    ${reviewButton(c)}
    ${section('What it is', c.summary)}
    ${section('The problem', c.problem)}
    ${section('What changes', c.change)}
    ${section('Why this fixes it', c.fix)}
    ${snippetsHtml(c.snippets ?? [])}
    ${reachHtml(c)}
    ${out.length || grid ? `<h4>Affects</h4><div class="links">${out.map(e => link(e, '→', e.to)).join('')}${gridLink}</div>` : ''}
    ${inn.length ? `<h4>Affected by</h4><div class="links">${inn.map(e => link(e, '←', e.from)).join('')}</div>` : ''}`;
}
function edgeHtml(e) {
  const K = EDGE_KIND[e.kind];
  return `
    <div class="tag" style="color:${K.color}">${K.label}</div>
    <h2>${esc(e.label)}</h2>
    <div class="route"><button data-card="${e.from}">${esc(byId[e.from].title)}</button><span class="arr">→</span><button data-card="${e.to}">${esc(byId[e.to].title)}</button></div>
    ${section('How they connect', e.connection)}
    ${codeLink(e.connection_at, esc(e.connection_at)).replace('class="codelink"', 'class="codelink at"')}
    <pre>${codeHtml(e.connection_code)}</pre>
    ${section('How the change flows', e.flow)}
    ${section('What the target does', e.effect)}`;
}
const storyHtml = () => `
  <h2 class="beat">Background</h2>
  <p>${fmt(META.background)}</p>
  <h2 class="beat">The issue</h2>
  <div class="issues">${META.issues.map(i => `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.label)} ${esc(i.title)}</a>`).join('')}</div>
  <p>${fmt(META.problem)}</p>
  <h2 class="beat">What this PR does</h2>
  <p>${story(META.solution)}</p>`;

function present(html, accent, item) {
  const target = listView ? detail : modal;
  target.style.setProperty('--accent', accent);
  target.innerHTML = listView ? html : `<button class="close" aria-label="Close">×</button>${html}`;
  target.scrollTop = 0;
  if (!listView) return modalBg.classList.add('open');
  if (!item) return;
  selected = item;
  for (const b of $('#items').querySelectorAll('.item')) {
    b.setAttribute('aria-current', b.dataset.item === item);
    if (b.dataset.item === item) b.scrollIntoView({ block: 'nearest' });
  }
}
const openCard = id => present(cardHtml(byId[id]), KIND[byId[id].kind].color, id);
const openEdge = id => { const e = EDGES.find(x => x.id === id); present(edgeHtml(e), EDGE_KIND[e.kind].color); };
const fileName = f => f.path.split('/').pop();
function openReach(n, i) {
  const f = n.files[i], name = fileName(f), last = n.files.length - 1;
  if (listView) setBranch(n, true);
  const pageTo = (to, step) => {
    const other = n.files[to];
    return `<button data-reach="${n.id}" data-file-to="${to}" data-file-step="${step}" ${other ? `aria-label="${step < 0 ? 'Previous' : 'Next'} file: ${esc(fileName(other))}"` : 'disabled'}>
      ${other ? `${step < 0 ? '← ' : ''}<span>${esc(fileName(other))}</span>${step > 0 ? ' →' : ''}` : ''}</button>`;
  };
  const pager = last ? `<div class="file-pager">${pageTo(i - 1, -1)}<span class="step-at">File ${i + 1} of ${n.files.length}</span>${pageTo(i + 1, 1)}</div>` : '';
  present(`${pager}<div class="tag" style="color:var(--muted)">Not changed · affected</div>
    <h2>${esc(name)}</h2>
    <div class="path">${codeLink(f.path, esc(f.path))}</div>
    ${section('What changes for it', f.effect)}
    <h4>Affected by</h4><div class="links"><button data-card="${n.source}">← ${esc(byId[n.source].title)}</button></div>`, 'var(--muted)', `${n.id}#${i}`);
}
const openOverview = () => present(`<h2>${esc(META.title)}</h2><div class="path">${metaHtml()}</div>${storyHtml()}`, 'var(--core)', OVERVIEW);
function hide() { modalBg.classList.remove('open'); }
function follow(ev) {
  const b = ev.target.closest('[data-edge]'); if (b) return openEdge(b.dataset.edge);
  const grid = ev.target.closest('[data-grid]'); if (grid) return showGrid(byId[grid.dataset.grid]);
  const file = ev.target.closest('[data-file-to]'); if (file) return openReach(byId[file.dataset.reach], +file.dataset.fileTo);
  const c = ev.target.closest('[data-card]'); if (c) openCard(c.dataset.card);
}
modalBg.addEventListener('click', ev => {
  if (ev.target === modalBg || ev.target.closest('.close')) return hide();
  follow(ev);
});
detail.addEventListener('click', follow);
addEventListener('keydown', ev => { if (ev.key === 'Escape') hide(); });
addEventListener('click', ev => {
  const step = ev.target.closest('[data-step]'); if (step) stepSnippet(step);
  const review = ev.target.closest('[data-review-toggle]'); if (review) toggleReviewed(review.dataset.reviewToggle);
});
const solution = $('#pstory'), linkIn = ev => ev.target.closest('[data-card]');
solution.addEventListener('pointerover', ev => { const l = linkIn(ev); if (l) focusSet(l.dataset.card, 'link'); });
solution.addEventListener('pointerout', ev => { if (linkIn(ev)) clearFocus(); });
solution.addEventListener('click', ev => { const l = linkIn(ev); if (l) openCard(l.dataset.card); });

/* ---------- layout ---------- */
const PER_ROW = 5, CARD_GAP = 120, LANE_GAP = 46, MIN_ROW_GAP = 170, ROW_GAP_PER_ARROW = 30, SWEEPS = 12;
let laneOf = {};

function autoLayout() {
  const nodes = allNodes(), links = allLinks();
  const rank = Object.fromEntries(nodes.map(c => [c.id, 0]));
  for (let i = 0; i < nodes.length; i++)
    for (const e of links) if (rank[e.to] <= rank[e.from] && rank[e.from] < nodes.length) rank[e.to] = rank[e.from] + 1;
  const rows = [], rowOf = {};
  for (let r = 0; r <= Math.max(0, ...Object.values(rank)); r++) {
    const ids = nodes.filter(c => rank[c.id] === r);
    for (let i = 0; i < ids.length; i += PER_ROW) {
      const row = ids.slice(i, i + PER_ROW).map(c => ({ card: c, w: cardEl[c.id].offsetWidth, up: [], down: [] }));
      row.forEach(n => (rowOf[n.card.id] = rows.length));
      rows.push(row);
    }
  }
  const nodeOf = id => rows[rowOf[id]].find(n => n.card.id === id);
  const join = (a, b) => { a.down.push(b); b.up.push(a); };

  // an arrow that skips rows takes a lane through each one, as a card of no width
  const lanes = {};
  for (const e of links) {
    if (rowOf[e.to] <= rowOf[e.from]) continue;
    let prev = nodeOf(e.from);
    lanes[e.id] = [];
    for (let r = rowOf[e.from] + 1; r < rowOf[e.to]; r++) {
      const lane = { w: 0, up: [], down: [] };
      rows[r].push(lane); lanes[e.id].push(lane); join(prev, lane); prev = lane;
    }
    join(prev, nodeOf(e.to));
  }

  const number = row => row.forEach((n, i) => (n.pos = i));
  rows.forEach(number);
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  const order = (row, key) => {
    const score = new Map(row.map(n => [n, n[key].length ? mean(n[key].map(m => m.pos)) : n.pos]));
    row.sort((a, b) => score.get(a) - score.get(b));
    number(row);
  };
  for (let i = 0; i < SWEEPS; i++) {
    const pass = i % 2 ? rows.slice().reverse() : rows;
    pass.forEach(row => order(row, i % 2 ? 'down' : 'up'));
  }

  const space = (a, b) => (a.w + b.w) / 2 + (a.card && b.card ? CARD_GAP : LANE_GAP);
  // left-packed and right-packed placements around the wanted spots, averaged, keep every gap
  const place = (row, want) => {
    const left = [], right = [];
    row.forEach((n, i) => (left[i] = i ? Math.max(want[i], left[i - 1] + space(row[i - 1], n)) : want[i]));
    for (let i = row.length - 1; i >= 0; i--) right[i] = i < row.length - 1 ? Math.min(want[i], right[i + 1] - space(row[i], row[i + 1])) : want[i];
    row.forEach((n, i) => (n.x = (left[i] + right[i]) / 2));
  };
  for (const row of rows) { let x = 0; row.forEach((n, i) => { x += i ? space(row[i - 1], n) : 0; n.x = x; }); const c = mean(row.map(n => n.x)); row.forEach(n => (n.x -= c)); }
  for (let i = 0; i < SWEEPS; i++) {
    const pass = i % 2 ? rows.slice().reverse() : rows, key = i % 2 ? 'down' : 'up';
    for (const row of pass) place(row, row.map(n => (n[key].length ? mean(n[key].map(m => m.x)) : n.x)));
  }

  let y = 0;
  rows.forEach(row => {
    const h = Math.max(0, ...row.filter(n => n.card).map(n => cardEl[n.card.id].offsetHeight));
    row.forEach(n => {
      if (n.card) { n.card.x = n.x - n.w / 2; n.card.y = y; cardEl[n.card.id].style.left = n.card.x + 'px'; cardEl[n.card.id].style.top = y + 'px'; }
      else { n.top = y; n.bottom = y + h; }
    });
    y += h + Math.max(MIN_ROW_GAP, 60 + ROW_GAP_PER_ARROW * row.reduce((s, n) => s + n.down.length, 0));
  });
  laneOf = lanes;
  sequence = rows.flat().filter(n => n.card && !n.card.source).map(n => n.card);
}

/* ---------- list view ---------- */
function buildList() {
  const items = $('#items');
  $('#lmeta').innerHTML = metaHtml();
  const fileRow = (n, f, i) => {
    const name = fileName(f);
    return `<button class="item file-item" data-item="${n.id}#${i}" style="--accent:var(--muted)">
      <strong>${esc(name)}</strong><span class="path">${esc(f.path.slice(0, -name.length))}</span></button>`;
  };
  const cardRow = c => {
    const n = reachNodes.find(r => r.source === c.id), count = n?.files.length;
    return `<button class="item" data-card="${c.id}" data-item="${c.id}" style="--accent:${KIND[c.kind].color}">
        <strong>${esc(c.title)}</strong>
        <span class="sub"><span class="tag">${KIND[c.kind].label}</span>
          <span class="stat"><span class="a">+${c.add}</span><span class="d">−${c.del}</span></span></span>
      </button>
      ${n ? `<div class="tree-branch">
        <button class="branch" data-branch="${n.id}" aria-expanded="true"><span class="chevron" aria-hidden="true">▾</span>${count} affected file${count > 1 ? 's' : ''} outside this PR</button>
        <div class="tree-children" data-children="${n.id}"><div>${n.files.map((f, i) => fileRow(n, f, i)).join('')}</div></div>
      </div>` : ''}`;
  };
  items.innerHTML = `<button class="item" data-card="${OVERVIEW}" data-item="${OVERVIEW}" style="--accent:var(--muted)"><strong>Overview</strong></button>` + sequence.map(cardRow).join('');
  items.addEventListener('click', ev => {
    const branch = ev.target.closest('[data-branch]');
    if (branch) return setBranch(byId[branch.dataset.branch], branch.getAttribute('aria-expanded') !== 'true');
    const b = ev.target.closest('[data-item]'); if (b) openItem(b.dataset.item);
  });
}
function setBranch(n, open) {
  $(`[data-branch="${n.id}"]`).setAttribute('aria-expanded', open);
  $(`[data-children="${n.id}"]`).inert = !open;
  if (!open && selected.startsWith(`${n.id}#`)) openItem(n.source);
}
function openItem(id) {
  if (id === OVERVIEW) return openOverview();
  const [node, file] = id.split('#');
  return file ? openReach(byId[node], +file) : openCard(id);
}
function setView(list) {
  listView = list; hide();
  document.body.classList.toggle('list', list);
  for (const b of document.querySelectorAll('#viewswitch button')) b.setAttribute('aria-pressed', (b.dataset.view === 'list') === list);
  const url = new URL(location);
  if (list) url.searchParams.set('view', 'list'); else url.searchParams.delete('view');
  history.replaceState(null, '', url);
  if (list) return openItem(selected);
  layoutEdges(); if (!touched) fit();
}
const MOVE_KEYS = { ArrowUp: -1, k: -1, ArrowDown: 1, j: 1 }, FILE_KEYS = { ArrowLeft: -1, h: -1, ArrowRight: 1, l: 1 }, SCROLL_STEP = 80;
addEventListener('keydown', ev => {
  const step = MOVE_KEYS[ev.key], fileStep = FILE_KEYS[ev.key];
  if (!listView && fileStep && modalBg.classList.contains('open')) modal.querySelector(`[data-file-step="${fileStep}"]:not(:disabled)`)?.click();
  if (!listView || !(step || fileStep) || ev.altKey || ev.metaKey || ev.shiftKey) return;
  ev.preventDefault();
  if (fileStep) {
    const [node, file] = selected.split('#'), n = file ? byId[node] : reachNodes.find(r => r.source === selected);
    return n && !ev.ctrlKey ? setBranch(n, fileStep > 0) : undefined;
  }
  if (ev.ctrlKey) return detail.scrollBy(0, step * SCROLL_STEP);
  const items = [...$('#items').querySelectorAll('.item')].filter(b => !b.closest('[inert]'));
  const next = items[items.findIndex(b => b.dataset.item === selected) + step];
  if (next) openItem(next.dataset.item);
});
$('#viewswitch').addEventListener('click', ev => { const b = ev.target.closest('[data-view]'); if (b) setView(b.dataset.view === 'list'); });

let reviewed = {}, reviewKey;

/* ---------- boot ---------- */
async function boot() {
  const id = new URLSearchParams(location.search).get('map');
  let data;
  try {
    const res = await fetch(`data/${encodeURIComponent(id)}.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (err) {
    document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px"><div><h2>No map found</h2><p>Ask Claude to map a PR, then open the link it gives you.</p></div></div>`);
    return;
  }
  META = data.pr; CARDS = data.cards; EDGES = data.edges; byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  loadReviewed(id);
  document.title = `PR #${META.number} · MergeAtlas`;
  $('#panel .brand img').src = $('link[rel=icon]').href;
  $('#ptitle').textContent = META.title;
  $('#pmeta').innerHTML = metaHtml();
  $('#pstory').innerHTML = storyHtml();
  build();
  if (innerWidth < 900) $('#ptoggle').click();
  await (document.fonts?.ready ?? Promise.resolve());
  autoLayout(); layoutEdges(); fit(); buildList(); showReviewed();
  setView(new URLSearchParams(location.search).get('view') === 'list');
  addEventListener('resize', () => { if (listView) return; layoutEdges(); if (!touched) fit(); });
}
let touched = false;
for (const t of ['wheel', 'pointerdown']) viewport.addEventListener(t, () => { touched = true; }, { capture: true });
boot();
</script>
</body>
