<style>
  :root {
    --bg: #f4f1ea;
    --dot: #cfc9bb;
    --card: #fffdf8;
    --ink: #1f1d1a;
    --muted: #6b665c;
    --line: #d9d3c5;
    --shadow: 0 1px 2px rgba(40,30,10,.08), 0 8px 24px rgba(40,30,10,.08);
    --core: #2f6fdb;
    --cleanup: #d9731f;
    --test: #2a9a6b;
    --docs: #7a7468;
    --config: #8a5bd6;
    --add: #1d8a56;
    --del: #c0392b;
    --overlay: rgba(31,29,26,.45);
    --code-bg: #f0ece1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --dot: #34323a; --card: #222127; --ink: #f1eee8; --muted: #a29d93;
      --line: #3a3841; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
      --core: #6b9bff; --cleanup: #f0944a; --test: #4cc593; --docs: #a39d8f; --config: #b392f0;
      --add: #4cc593; --del: #ef7b6d; --overlay: rgba(0,0,0,.6); --code-bg: #1a191e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #viewport { position: fixed; inset: 0; cursor: grab; touch-action: none;
    background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 28px 28px; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges .hit { pointer-events: stroke; cursor: pointer; fill: none; stroke: transparent; stroke-width: 22; }
  #edges .line { fill: none; stroke-width: 2.5; transition: stroke-width .12s, opacity .12s; }
  #edges .grp.dim { opacity: .18; }
  #edges .grp:hover .line, #edges .grp.on .line { stroke-width: 4; }
  .pill { position: absolute; transform: translate(-50%, -50%); background: var(--card); border: 1.5px solid;
    border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer;
    box-shadow: var(--shadow); user-select: none; transition: opacity .12s; }
  .pill.dim { opacity: .18; }
  .pill:hover { filter: brightness(1.08); }

  .card { position: absolute; width: 400px; background: var(--card); border: 1px solid var(--line);
    border-top: 5px solid var(--accent); border-radius: 14px; box-shadow: var(--shadow); cursor: pointer;
    padding: 16px 18px 16px; user-select: none; transition: opacity .12s, box-shadow .12s; }
  .card:hover { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  .card.dim { opacity: .35; }
  .card.dragging { cursor: grabbing; box-shadow: 0 0 0 2px var(--accent), 0 16px 40px rgba(0,0,0,.2); }
  .card.stack, .card.reach-card { box-sizing: border-box; width: 300px; --accent: var(--muted); border-top-style: dashed; }
  .card.stack { box-shadow: 6px 6px 0 -1px var(--card), 6px 6px 0 0 var(--line), 12px 12px 0 -1px var(--card), 12px 12px 0 0 var(--line), var(--shadow); }
  .card.stack:hover { box-shadow: 6px 6px 0 -1px var(--card), 6px 6px 0 0 var(--muted), 12px 12px 0 -1px var(--card), 12px 12px 0 0 var(--muted), var(--shadow); }
  .card.stack.open, .card.stack.open:hover { z-index: 3; cursor: default; box-shadow: 0 0 0 1px var(--muted), 0 16px 40px rgba(0,0,0,.28); }
  .card.stack > h3 { text-wrap: balance; }
  .stack-files { position: absolute; left: 50%; top: 0; visibility: hidden; }
  .card.reach-file { width: 260px; transition: none; will-change: transform, opacity; }
  .card.reach-card h3 { font-size: 16px; overflow-wrap: anywhere; }
  .card.reach-card p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; margin: 0; font-size: 13px; }
  .stack-toggle { margin-left: auto; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
  .stack-toggle:hover { border-color: var(--muted); }
  #edges .grp.reach .line { stroke-dasharray: 7 6; stroke-width: 2; }
  #edges .grp.reach .hit { pointer-events: none; }
  .card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .stat { margin-left: auto; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .stat .a { color: var(--add); } .stat .d { color: var(--del); margin-left: 6px; }
  .card h3 { margin: 0 0 2px; font-size: 19px; letter-spacing: -.01em; }
  .path { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .card p { margin: 0 0 10px; }
  .card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .card li { margin-bottom: 3px; }
  .more { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--accent); }

  #panel { position: fixed; left: 16px; top: 16px; width: min(380px, calc(100vw - 32px)); background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px; z-index: 5; }
  #panel .brand { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
  #panel .brand img { width: 24px; height: 24px; }
  #panel h1 { margin: 0 0 2px; font-size: 16px; line-height: 1.3; }
  #panel .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #panel { max-height: calc(100vh - 32px); overflow: auto; }
  #panel .body { font-size: 13px; }
  h2.beat, .sheet h2.beat { margin: 12px 0 3px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #panel .body p { margin: 0; }
  .issues a { display: block; margin-bottom: 4px; color: var(--core); font-weight: 600; text-decoration: none; }
  .issues a:hover { text-decoration: underline; }
  .cardlink { font: inherit; color: var(--core); background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
    text-decoration: underline dotted; text-underline-offset: 2px; }
  .cardlink:hover { text-decoration-style: solid; }
  .codelink { color: var(--core); }
  .sheet .at { display: block; margin-top: 8px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  #panel.collapsed .body { display: none; }
  #panel button.toggle { float: right; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legend i.ln { height: 3px; width: 16px; border-radius: 2px; vertical-align: 3px; }

  #controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 5; align-items: center; }
  #controls button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); font-size: 18px; cursor: pointer; box-shadow: var(--shadow); }
  #controls button.wide { width: auto; padding: 0 12px; font-size: 13px; }
  #zoomlabel { font-size: 12px; color: var(--muted); min-width: 42px; text-align: center; }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 12px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; z-index: 4; white-space: nowrap; }
  @media (max-width: 720px) { #hint { display: none; } }

  #modal-bg { position: fixed; inset: 0; background: var(--overlay); display: none; z-index: 20; align-items: center; justify-content: center; padding: 16px; }
  #modal-bg.open { display: flex; }
  #modal { background: var(--card); border-radius: 16px; width: min(720px, 100%); max-height: calc(100vh - 32px); overflow: auto;
    border-top: 6px solid var(--accent); box-shadow: 0 24px 80px rgba(0,0,0,.35); padding: 22px 26px 24px; position: relative; }
  .sheet h2 { margin: 2px 0 2px; font-size: 22px; letter-spacing: -.01em; }

<script>
const KIND = {

  replaces: { color: 'var(--cleanup)', label: 'Makes redundant' },
  verifies: { color: 'var(--test)',    label: 'Verified by' },
  docs:     { color: 'var(--docs)',    label: 'Documented in' },

const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const story = t => fmt(t).replace(/\[([^\]]+)\]\(([\w-]+)\)/g, '<button class="cardlink" data-card="$2">$1</button>');
const codeHtml = t => esc(t).split('\n').map(l => l.startsWith('+') ? `<span class="a">${l}</span>` : l.startsWith('-') ? `<span class="d">${l}</span>` : l).join('\n');

const $ = (s, r = document) => r.querySelector(s);
const viewport = $('#viewport'), world = $('#world'), svg = $('#edges');
const view = { x: 0, y: 0, k: 1 };
const cardEl = {}; let byId = {};
const NS = 'http://www.w3.org/2000/svg';
const pillEl = {}, grpEl = {};
const reachNodes = [];
const allNodes = () => [...CARDS, ...reachNodes];
const allLinks = () => [...EDGES, ...reachNodes.map(n => ({ id: `to:${n.id}`, from: n.source, to: n.id, kind: 'reach' }))];

/* ---------- build ---------- */
function build() {
  // markers
  const defs = document.createElementNS(NS, 'defs');
  for (const [k, v] of Object.entries(EDGE_KIND)) {
    const m = document.createElementNS(NS, 'marker');
    m.setAttribute('id', 'arrow-' + k); m.setAttribute('viewBox', '0 0 10 10'); m.setAttribute('refX', '9'); m.setAttribute('refY', '5');

    m.setAttribute('markerUnits', 'userSpaceOnUse'); m.setAttribute('markerWidth', '14'); m.setAttribute('markerHeight', '14');
    const p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M0,0 L10,5 L0,10 z'); p.setAttribute('fill', v.color);
    m.appendChild(p); defs.appendChild(m);
  }
  svg.appendChild(defs);

  for (const e of EDGES) {
    const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'grp');
    const line = document.createElementNS(NS, 'path'); line.setAttribute('class', 'line');
    line.setAttribute('stroke', EDGE_KIND[e.kind].color); line.setAttribute('marker-end', `url(#arrow-${e.kind})`);
    const hit = document.createElementNS(NS, 'path'); hit.setAttribute('class', 'hit');

  for (const c of CARDS) {
    const el = document.createElement('div'); el.className = 'card'; el.dataset.reviewCard = c.id;
    el.style.setProperty('--accent', KIND[c.kind].color);
    el.innerHTML = `
      <div class="top"><span class="tag">${KIND[c.kind].label}</span>
        <span class="stat"><span class="a">+${c.add}</span><span class="d">−${c.del}</span></span></div>
      <h3>${esc(c.title)}</h3>
      <div class="path">${esc(c.paths.length > 1 ? `${c.paths.length} files · ${c.paths[0]} …` : c.paths[0])}</div>
      <p>${fmt(c.summary)}</p>
      <ul>${c.bullets.map(b => `<li>${fmt(b)}</li>`).join('')}</ul>

}
const reachFileHtml = f => {
  const name = fileName(f), preview = f.effect.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
  return `<div class="top"><span class="tag">Not changed · affected</span></div>
    <h3>${esc(name)}</h3>
    <div class="path">${esc(f.path.slice(0, -name.length))}</div>
    <p>${fmt(preview)}</p>`;
};
function buildReach() {
  for (const c of CARDS) {
    const files = (c.reaches ?? []).flatMap(r => r.paths.map(path => ({ path, effect: r.effect })));
    if (!files.length) continue;
    const n = { id: `reach:${c.id}`, source: c.id, files, progress: 0, target: 0 };
    const stacked = files.length > 1;
    const el = document.createElement('div'); el.className = `card ${stacked ? 'stack' : 'reach-card'}`;
    el.innerHTML = stacked ? `
      <div class="top"><span class="tag">Not changed · affected</span><button class="stack-toggle">Show files</button></div>
      <h3>${files.length} affected files outside this PR</h3>
      <div class="stack-files">${files.map((f, i) => `<div class="card reach-card reach-file" data-file="${i}">${reachFileHtml(f)}</div>`).join('')}</div>`
      : reachFileHtml(files[0]);
    world.appendChild(el); cardEl[n.id] = el; byId[n.id] = n;
    attachCardDrag(el, n, pressed => {
      if (!stacked) return openReach(n, 0);
      const file = pressed.closest('[data-file]');
      if (file) openReach(n, +file.dataset.file);
      else if (n.target === 0 || pressed.closest('.stack-toggle')) toggleStack(n);
    });
    el.addEventListener('pointerenter', () => focusSet(c.id, 'card'));
    el.addEventListener('pointerleave', clearFocus);
    const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'grp reach');
    const line = document.createElementNS(NS, 'path'); line.setAttribute('class', 'line');
    line.setAttribute('stroke', EDGE_KIND.reach.color); line.setAttribute('marker-end', 'url(#arrow-reach)');
    const hit = document.createElementNS(NS, 'path'); hit.setAttribute('class', 'hit');
    g.append(line, hit); svg.appendChild(g);
    grpEl[`to:${n.id}`] = { g, line, hit };
    reachNodes.push(n);
  }
}
function measureStack(n) {
  const el = cardEl[n.id], files = [...el.querySelectorAll('.reach-file')];
  const fileH = Math.max(...files.map(f => f.offsetHeight)), fileW = files[0].offsetWidth;
  const columns = Math.min(files.length, STACK_COLUMNS), rows = Math.ceil(files.length / columns);
  const w = el.offsetWidth, h = el.offsetHeight;
  const openW = columns * fileW + (columns - 1) * FILE_GAP + STACK_PADDING * 2;
  const top = h - 8, openH = top + rows * fileH + (rows - 1) * FILE_GAP + STACK_PADDING;
  n.size = { w, h, openW, openH };
  n.spots = files.map((f, i) => {
    const left = STACK_PADDING + (i % columns) * (fileW + FILE_GAP) - openW / 2, y = top + Math.floor(i / columns) * (fileH + FILE_GAP);
    f.style.left = left + 'px'; f.style.top = y + 'px'; f.style.height = fileH + 'px';
    return { f, dx: -left - fileW / 2, dy: h - 24 - y };
  });
}
function drawStack(n) {
  const el = cardEl[n.id], { w, h, openW, openH } = n.size, e = smooth(n.progress);
  const width = w + (openW - w) * e;
  n.x -= (width - (n.width ?? w)) / 2; n.width = width;
  el.style.left = n.x + 'px'; el.style.width = width + 'px'; el.style.height = h + (openH - h) * e + 'px';
  const reveal = 1 + FILE_STAGGER * (n.spots.length - 1);
  n.spots.forEach(({ f, dx, dy }, i) => {
    const t = smooth(Math.min(1, Math.max(0, n.progress * reveal - i * FILE_STAGGER))), left = 1 - t;
    f.style.transform = `translate(${dx * left}px, ${dy * left}px) scale(${.88 + .12 * t})`;
    f.style.opacity = Math.min(1, t * 2);

}
function toggleStack(n) {
  const el = cardEl[n.id];

  el.querySelector('.stack-toggle').textContent = n.target ? 'Collapse' : 'Show files';

  const el = cardEl[id], c = byId[id];
  return { l: c.x, t: c.y, r: c.x + el.offsetWidth, b: c.y + el.offsetHeight, w: el.offsetWidth, h: el.offsetHeight };
}
function chooseSides(a, b) {

  const u = 1 - t, at = n => u*u*u*s[0][n] + 3*u*u*t*s[1][n] + 3*u*t*t*s[2][n] + t*t*t*s[3][n];

};

  const placed = [], clear = 8;
  const free = (x, y, w, h) => placed.every(p => Math.abs(x - p.x) > (w + p.w) / 2 + clear || Math.abs(y - p.y) > (h + p.h) / 2 + clear);
  for (const { id, segs } of curves) {
    const pill = pillEl[id], w = pill.offsetWidth, h = pill.offsetHeight;
    let spot = null;
    for (const t of [0.5, 0.35, 0.65, 0.2, 0.8]) {

      rows[r].push(lane); lanes[e.id].push(lane); join(prev, lane); prev = lane;
    }
    join(prev, nodeOf(e.to));
  }

  const number = row => row.forEach((n, i) => (n.pos = i));
  rows.forEach(number);
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  const order = (row, key) => {
    const score = new Map(row.map(n => [n, n[key].length ? mean(n[key].map(m => m.pos)) : n.pos]));
    row.sort((a, b) => score.get(a) - score.get(b));
    number(row);
  };
  for (let i = 0; i < SWEEPS; i++) {
    const pass = i % 2 ? rows.slice().reverse() : rows;
    pass.forEach(row => order(row, i % 2 ? 'down' : 'up'));
  }

  const space = (a, b) => (a.w + b.w) / 2 + (a.card && b.card ? CARD_GAP : LANE_GAP);
  // left-packed and right-packed placements around the wanted spots, averaged, keep every gap
  const place = (row, want) => {
    const left = [], right = [];
    row.forEach((n, i) => (left[i] = i ? Math.max(want[i], left[i - 1] + space(row[i - 1], n)) : want[i]));
    for (let i = row.length - 1; i >= 0; i--) right[i] = i < row.length - 1 ? Math.min(want[i], right[i + 1] - space(row[i], row[i + 1])) : want[i];
    row.forEach((n, i) => (n.x = (left[i] + right[i]) / 2));
  };
  for (const row of rows) { let x = 0; row.forEach((n, i) => { x += i ? space(row[i - 1], n) : 0; n.x = x; }); const c = mean(row.map(n => n.x)); row.forEach(n => (n.x -= c)); }
  for (let i = 0; i < SWEEPS; i++) {
    const pass = i % 2 ? rows.slice().reverse() : rows, key = i % 2 ? 'down' : 'up';
    for (const row of pass) place(row, row.map(n => (n[key].length ? mean(n[key].map(m => m.x)) : n.x)));
  }

  let y = 0;
  rows.forEach(row => {
    const h = Math.max(0, ...row.filter(n => n.card).map(n => cardEl[n.card.id].offsetHeight));
    row.forEach(n => {
      if (n.card) { n.card.x = n.x - n.w / 2; n.card.y = y; cardEl[n.card.id].style.left = n.card.x + 'px'; cardEl[n.card.id].style.top = y + 'px'; }
      else { n.top = y; n.bottom = y + h; }
    });
    y += h + Math.max(MIN_ROW_GAP, 60 + ROW_GAP_PER_ARROW * row.reduce((s, n) => s + n.down.length, 0));
  });
  laneOf = lanes;
  sequence = rows.flat().filter(n => n.card && !n.card.source).map(n => n.card);
}

/* ---------- list view ---------- */
function buildList() {
  const items = $('#items');
  $('#lmeta').innerHTML = metaHtml();
  const fileRow = (n, f, i) => {
    const name = fileName(f);
    return `<button class="item file-item" data-item="${n.id}#${i}" style="--accent:var(--muted)">
      <strong>${esc(name)}</strong><span class="path">${esc(f.path.slice(0, -name.length))}</span></button>`;
  };
  const cardRow = c => {
    const n = reachNodes.find(r => r.source === c.id), count = n?.files.length;
    return `<button class="item" data-card="${c.id}" data-item="${c.id}" style="--accent:${KIND[c.kind].color}">
        <strong>${esc(c.title)}</strong>
        <span class="sub"><span class="tag">${KIND[c.kind].label}</span>
          <span class="stat"><span class="a">+${c.add}</span><span class="d">−${c.del}</span></span></span>
      </button>
      ${n ? `<div class="tree-branch">
        <button class="branch" data-branch="${n.id}" aria-expanded="true"><span class="chevron" aria-hidden="true">▾</span>${count} affected file${count > 1 ? 's' : ''} outside this PR</button>
        <div class="tree-children" data-children="${n.id}"><div>${n.files.map((f, i) => fileRow(n, f, i)).join('')}</div></div>
      </div>` : ''}`;
  };
  items.innerHTML = `<button class="item" data-card="${OVERVIEW}" data-item="${OVERVIEW}" style="--accent:var(--muted)"><strong>Overview</strong></button>` + sequence.map(cardRow).join('');
  items.addEventListener('click', ev => {
    const branch = ev.target.closest('[data-branch]');
    if (branch) return setBranch(byId[branch.dataset.branch], branch.getAttribute('aria-expanded') !== 'true');
    const b = ev.target.closest('[data-item]'); if (b) openItem(b.dataset.item);
  });
}
function setBranch(n, open) {
  $(`[data-branch="${n.id}"]`).setAttribute('aria-expanded', open);
  $(`[data-children="${n.id}"]`).inert = !open;
  if (!open && selected.startsWith(`${n.id}#`)) openItem(n.source);
}
function openItem(id) {
  if (id === OVERVIEW) return openOverview();
  const [node, file] = id.split('#');
  return file ? openReach(byId[node], +file) : openCard(id);
}
function setView(list) {
  listView = list; hide();
  document.body.classList.toggle('list', list);
  for (const b of document.querySelectorAll('#viewswitch button')) b.setAttribute('aria-pressed', (b.dataset.view === 'list') === list);
  const url = new URL(location);
  if (list) url.searchParams.set('view', 'list'); else url.searchParams.delete('view');
  history.replaceState(null, '', url);
  if (list) return openItem(selected);
  layoutEdges(); if (!touched) fit();
}
const MOVE_KEYS = { ArrowUp: -1, k: -1, ArrowDown: 1, j: 1 }, FILE_KEYS = { ArrowLeft: -1, h: -1, ArrowRight: 1, l: 1 }, SCROLL_STEP = 80;
addEventListener('keydown', ev => {
  const step = MOVE_KEYS[ev.key], fileStep = FILE_KEYS[ev.key];
  if (!listView && fileStep && modalBg.classList.contains('open')) modal.querySelector(`[data-file-step="${fileStep}"]:not(:disabled)`)?.click();
  if (!listView || !(step || fileStep) || ev.altKey || ev.metaKey || ev.shiftKey) return;
  ev.preventDefault();
  if (fileStep) {
    const [node, file] = selected.split('#'), n = file ? byId[node] : reachNodes.find(r => r.source === selected);
    return n && !ev.ctrlKey ? setBranch(n, fileStep > 0) : undefined;
  }
  if (ev.ctrlKey) return detail.scrollBy(0, step * SCROLL_STEP);
  const items = [...$('#items').querySelectorAll('.item')].filter(b => !b.closest('[inert]'));
  const next = items[items.findIndex(b => b.dataset.item === selected) + step];
  if (next) openItem(next.dataset.item);
});
$('#viewswitch').addEventListener('click', ev => { const b = ev.target.closest('[data-view]'); if (b) setView(b.dataset.view === 'list'); });

let reviewed = {}, reviewKey;

/* ---------- boot ---------- */
async function boot() {
  const id = new URLSearchParams(location.search).get('map');
  let data;
  try {
    const res = await fetch(`data/${encodeURIComponent(id)}.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (err) {
    document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px"><div><h2>No map found</h2><p>Ask Claude to map a PR, then open the link it gives you.</p></div></div>`);
    return;
  }
  META = data.pr; CARDS = data.cards; EDGES = data.edges; byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  loadReviewed(id);
  document.title = `PR #${META.number} · MergeAtlas`;
  $('#panel .brand img').src = $('link[rel=icon]').href;
  $('#ptitle').textContent = META.title;
  $('#pmeta').innerHTML = metaHtml();
  $('#pstory').innerHTML = storyHtml();
  build();
  if (innerWidth < 900) $('#ptoggle').click();
  await (document.fonts?.ready ?? Promise.resolve());
  autoLayout(); layoutEdges(); fit(); buildList(); showReviewed();
  setView(new URLSearchParams(location.search).get('view') === 'list');
  addEventListener('resize', () => { if (listView) return; layoutEdges(); if (!touched) fit(); });
}
let touched = false;
for (const t of ['wheel', 'pointerdown']) viewport.addEventListener(t, () => { touched = true; }, { capture: true });
boot();
</script>
</body>
